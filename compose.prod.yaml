x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# 本番用オーバーレイ。開発ツールを外し、公開層をプロファイルで選ぶ。
#   bin/publish.sh   （= compose.prod.yaml を重ねて起動。配布イメージなら pull、なければ build）
#   （.env で COMPOSE_FILE=compose.yaml:compose.prod.yaml を設定すれば -f 省略可）
#
# 公開方式は .env の COMPOSE_PROFILES で選択:
#   tunnel … Cloudflare Tunnel（ポート開放不要・既定）
#   caddy  … Caddy 自動HTTPS（ドメイン＋80/443開放。どの VPS/AWS でも）
#   （未設定）… host nginx / ALB の背後。nginx はループバックのみに束縛
# ── コンテナ強化（#112）──
# no-new-privileges: setuid バイナリ等で権限を上げられない。cap_drop ALL: 既定で全 capability を
# 落とし、各サービスに要るものだけ cap_add で戻す（root で起動して自分のユーザーへ落ちる
# 公式イメージが多いので、SETUID / SETGID / CHOWN は要る。ポート 80/443 を root で bind するにも
# cap を落とした後は NET_BIND_SERVICE が要る）。pids_limit はフォーク爆弾の上限。
# read_only は EC-CUBE が var/ 等へ書くので付けない。メモリ上限は運用ごとに違うので付けない
# （付けるなら mem_limit。キャッシュの組み立ては 1G 使う）。
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  ec-cube:
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      # 本番は必ず公開層（cloudflared / caddy / ホスト nginx）の背後で、HTTPS はそこで終端する。
      # 直前の peer を信頼しないと $request->isSecure() が false のままになり、
      # セッション Cookie に Secure が付かず、生成 URL とリダイレクトが http:// になり、
      # 記録される IP が公開層のコンテナの IP になる（#106）。
      # REMOTE_ADDR は「直前の peer だけ」。nginx は 127.0.0.1 にしか開いていないので、
      # そこへ来られるのは公開層だけ。複数ホストで LB の IP を絞るなら .env で上書き。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-REMOTE_ADDR}
    restart: always

  nginx:
    # 外から直接叩かせない。公開層（cloudflared/caddy/ホスト nginx）から nginx:80 へ来る。
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    restart: always

  db:
    restart: always

  # ── tunnel プロファイル: Cloudflare Tunnel ──
  # サーバーからの outbound だけで公開。80/443 を開けず、オリジン IP も隠れる。
  # TUNNEL_TOKEN は Cloudflare Zero Trust の Tunnel 作成時に発行。公開ホスト名は
  # ダッシュボード側で <ドメイン> → http://nginx:80 を設定する。
  cloudflared:
    <<: *hardened
    pids_limit: 64
    networks:
      - frontend
    logging: *default-logging
    # latest は使わない（#114）。上げるときはここを変えてリリースする
    image: cloudflare/cloudflared:2026.8.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    # 公開層の SPOF 対策: 同一トークンで複数レプリカを張れる（Cloudflare 側で自動分散）。
    # 必要なら次を有効化:
    # deploy:
    #   replicas: 2
    restart: always

  # ── caddy プロファイル: 自動 HTTPS（Let's Encrypt）──
  # ドメインの A レコードをこのサーバーへ向け、80/443 を開ける。SITE_DOMAIN を .env で指定。
  caddy:
    <<: *hardened
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    networks:
      - frontend
    logging: *default-logging
    image: caddy:2.11.4-alpine
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      - eccube_app:/var/www/html:ro
      # 独自 CSS/JS はホスト側 bind を直接配信（nginx と同様）
      - ./html/user_data:/var/www/html/html/user_data:ro
      # アップロード画像を配信
      - eccube_upload:/var/www/html/html/upload:ro
      # オリジナルテーマの静的物（nginx と同様）
      - ./html/template/original:/var/www/html/html/template/original:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ec-cube
    restart: always

volumes:
  caddy_data:
  caddy_config:
