# EC-CUBE アプリイメージを build して GHCR へ push する。
#
# 目的:
#   1) 複数ホスト運用（compose.app.yaml）で「全ホストが同一イメージ」を保証する。
#   2) **配布**。利用者は build せず pull だけで動かす（.env の ECCUBE_IMAGE）。
#
# トリガ:
#   - タグ push（v*）… リリース。**これが配布の実体**で、利用者が追うタグが動く。
#                     **Dockerfile（docker/php/**）とこのワークフローが前のタグから変わっていなければ
#                     焼かない。** いまの追跡タグ（<系列>-php<版>。直近の焼き直し＝同じ Dockerfile）に
#                     -vX.Y.Z の名前を足すだけ（imagetools create。来歴と SBOM もそのまま付く）。
#                     文書や bin/ だけのリリースで 9 通り × 4 分を回さないため。
#   - 定期（毎週月曜 03:00 JST）… **PHP と Debian のパッチを取り込むため**の焼き直し。
#                     Dockerfile は**最新リリースのタグ**のものを使う（main の未リリース分を
#                     配らない）。追跡タグ（4.3 / 4.3-php8.2）と日付タグを動かす。
#                     -vX.Y.Z は動かさない（あれは「そのリリースの時点」の固定）。
#                     **キャッシュを使わない**（apt の layer が当たると Debian のパッチが
#                     入らず、焼き直した意味が無い）。緊急のパッチは手動実行で当日焼く。
#   - pull_request  … Dockerfile を壊していないか確かめるだけ（push しない）。
#   - 手動実行      … 系列を指定して試し焼き。**追跡タグは動かさない**（sha だけ）。
#                     `refresh: true` を付けると定期と同じ扱い（追跡タグと日付タグを動かす）。
#
#   ブランチへの push では動かさない。main で動かすと利用者が引くものが予告なく
#   変わり、保守ブランチで動かすと直接 push のたびに回る。
#
# **`pull_request` に `types` を必ず書くこと。** 省くと既定の活動タイプに
# `synchronize` が入り、**PR ブランチへ push するたびに matrix 全ジョブが回る。**
# `push:` を消しただけでは止まらない。4.4 の実ビルドは 1 回 3 分半かかる。
#
# その代わり、**PR を開いたあとに Dockerfile を直しても CI は回らない。**
# チェックの結果は最新コミットのものとは限らない。確かめ直したいときは
# 手動実行（workflow_dispatch）を使う。
#
# 生成タグ（<owner>/<repo> は GitHub の所有者とリポジトリ名）。系列ごとに PHP を
# 複数焼き、**系列の既定 PHP には `-php` 無しの短いタグも打つ**:
#   ghcr.io/<owner>/<repo>/ec-cube:4.3               … 追跡。**本番はこれ**（毎週の焼き直しで
#                                                      PHP / Debian のパッチが入る。bin/deploy.sh が引き直す）
#   ghcr.io/<owner>/<repo>/ec-cube:4.3-php8.3        … PHP を選ぶとき（追跡）
#   ghcr.io/<owner>/<repo>/ec-cube:4.3-20260907      … 日付固定。「同じものを何度も立てる」人向け
#   ghcr.io/<owner>/<repo>/ec-cube:4.3-v1.2.0        … リリース時点の固定
#   ghcr.io/<owner>/<repo>/ec-cube:4.3-php8.3-v1.2.0 … 同上、PHP 指定
#   ghcr.io/<owner>/<repo>/ec-cube:4.3-<sha>         … ロールバック・試し焼き用
#
#   **`latest` は作らない。** EC-CUBE は 4.2 / 4.3 / 4.4 が並行して現役で、
#   単一の「最新」は存在しない。作ると、利用者は自分がどの系列を引くのか
#   指定できないまま、マイナーをまたぐ更新を引き当てる。
#
# 認証は GITHUB_TOKEN（permissions: packages: write）。追加シークレット不要。
name: build-image

on:
  push:
    tags: ["v*"]
  schedule:
    # 毎週月曜 03:00 JST（= 日曜 18:00 UTC）。PHP の月例パッチ（木曜）を翌週頭に取り込む
    - cron: "0 18 * * 0"
  pull_request:
    types: [opened, reopened]
    paths:
      - "docker/php/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      series:
        description: "対象の系列（空なら全系列）。例: 4.4"
        required: false
        default: ""
      refresh:
        description: "定期と同じ焼き直し（最新リリースの Dockerfile・キャッシュ無し・追跡タグと日付タグを動かす）"
        type: boolean
        required: false
        default: false

# 同じ ref で走っているものは、新しいほうだけ残す（実行時間ぶん課金されるため）。
# **リリース（タグ）は止めない。** タグごとに ref が違うので group も別になるが、
# 取り違えないよう cancel は pull_request のときだけに限定する。
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ec-cube

jobs:
  # 焼く対象の一覧を作る。
  #
  # **系列ごとに焼く PHP の一覧と、phpredis が決まる。** PHP は上流の README の
  # 対応一覧に従う（4.2: 7.4–8.1、4.3: 8.1–8.3、4.4: 8.2–8.5）。4.2 の既定 8.2 は
  # 対応一覧の外だが composer の制約（^8.0）には入り、v1.0.0 からそれで配っている。
  # phpredis は EC-CUBE 側の Symfony Cache と両立しないバージョンがあり、間違えると
  # 起動時に落ちる（docker/php/Dockerfile のコメント参照）。**bin/lib/image.sh の
  # image_php_for_series / image_phpredis_for_series と揃えること。**
  # `default: true` の 1 つに `-php` 無しの短いタグを打つ。
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      ref: ${{ steps.ref.outputs.ref }}
      refresh: ${{ steps.ref.outputs.refresh }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 定期（と refresh 指定の手動実行）は**最新リリースのタグ**の Dockerfile を焼く。
          # main を焼くと、リリースしていない Dockerfile の変更が追跡タグで配られる。
          refresh=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            refresh=true
          fi
          ref="${{ github.sha }}"
          if [ "$refresh" = true ]; then
            ref="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
            [ -n "$ref" ] || { echo "リリースがまだ無いので焼き直せません" >&2; exit 1; }
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "ref=$ref refresh=$refresh"
      - id: build
        run: |
          # **4.4 は `4.4.x-dev`。** Packagist に 4.4 のリリースはまだ 1 つも無く、
          # 上流にあるのは `4.4` ブランチだけなので `~4.4.0` は解決できない
          # （`Could not find package ec-cube/ec-cube with version ~4.4.0`）。
          # `dev-4.4` も不可で、通るのは `4.4.x-dev` の形。
          #
          # **これは動く的なので、焼くたびに中身が変わる。** 4.4 が正式に出たら
          # `~4.4.0` へ変えること。それまで 4.4 のイメージは「その時点の
          # ブランチの写し」であって、再現しない。
          all='[
            {"series":"4.2","eccube":"~4.2.0",  "php":"8.1","phpredis":"6.0.2","default":false},
            {"series":"4.2","eccube":"~4.2.0",  "php":"8.2","phpredis":"6.0.2","default":true},
            {"series":"4.3","eccube":"~4.3.0",  "php":"8.1","phpredis":"6.0.2","default":false},
            {"series":"4.3","eccube":"~4.3.0",  "php":"8.2","phpredis":"6.0.2","default":true},
            {"series":"4.3","eccube":"~4.3.0",  "php":"8.3","phpredis":"6.0.2","default":false},
            {"series":"4.4","eccube":"4.4.x-dev","php":"8.2","phpredis":"6.3.0","default":false},
            {"series":"4.4","eccube":"4.4.x-dev","php":"8.3","phpredis":"6.3.0","default":true},
            {"series":"4.4","eccube":"4.4.x-dev","php":"8.4","phpredis":"6.3.0","default":false},
            {"series":"4.4","eccube":"4.4.x-dev","php":"8.5","phpredis":"6.3.0","default":false}
          ]'
          want='${{ github.event.inputs.series }}'
          if [ -n "$want" ]; then
            matrix="$(printf '%s' "$all" | jq -c --arg s "$want" '[.[] | select(.series == $s)]')"
            if [ "$(printf '%s' "$matrix" | jq 'length')" = "0" ]; then
              echo "系列 '$want' は対象外です。" >&2
              exit 1
            fi
          else
            matrix="$(printf '%s' "$all" | jq -c .)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # リリース（タグ push）で、イメージの中身に関わるファイルが前のタグから変わっていなければ
      # 焼かずに名前だけ足す（retag）。それ以外は build。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.ref_type == 'tag'
        with:
          fetch-depth: 0
      - id: mode
        env:
          MATRIX: ${{ steps.build.outputs.matrix }}
        run: |
          mode=build
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              changed="$(git diff --name-only "$prev" "$GITHUB_REF_NAME" -- docker/php .github/workflows/build-image.yml | wc -l)"
              if [ "$changed" = 0 ]; then
                mode=retag
                # 名前を足す元（追跡タグ）が全部あることを確かめる。無ければ焼く
                for pair in $(printf '%s' "$MATRIX" | jq -r '.[] | "\(.series)-php\(.php)"'); do
                  docker buildx imagetools inspect "ghcr.io/${{ github.repository }}/ec-cube:${pair}" >/dev/null 2>&1 || { echo "追跡タグ ${pair} が無いので焼く"; mode=build; break; }
                done
              fi
              echo "前のタグ: $prev  変更ファイル: $changed  → $mode"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: setup
    if: needs.setup.outputs.mode != 'retag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Trivy の結果を Security → Code scanning に載せる
      security-events: write
    strategy:
      # 1 系列が落ちても他は焼く。**片方だけ古いまま**にならないよう、
      # 失敗した系列は次のリリースまで前のタグが残る（追跡タグは動かない）。
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        # pull_request では push しないので認証も要らない（fork からの PR で
        # トークンが読み取り専用になり、login 自体が失敗するため）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: タグを決める
        id: tags
        run: |
          img="${REGISTRY}/${IMAGE_NAME}"
          series='${{ matrix.target.series }}'
          php='${{ matrix.target.php }}'
          is_default='${{ matrix.target.default }}'
          refresh='${{ needs.setup.outputs.refresh }}'
          sha='${{ needs.setup.outputs.ref }}'
          case "$sha" in v*) sha="$(git rev-parse HEAD)" ;; esac

          # 系列＋PHP を軸にし、既定 PHP には `-php` 無しの短い名前も打つ
          bases="${series}-php${php}"
          [ "$is_default" = "true" ] && bases="${bases} ${series}"

          tags=""
          add() { tags="${tags}${tags:+,}${img}:$1"; }
          for b in $bases; do
            # 常に sha 付きを打つ（ロールバックの固定参照）
            add "${b}-${sha}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              # リリース: 時点の固定 + 追跡
              add "${b}-${GITHUB_REF_NAME}"; add "$b"
            elif [ "$refresh" = "true" ]; then
              # 定期の焼き直し: 日付の固定 + 追跡（-vX.Y.Z は動かさない）
              add "${b}-$(date -u +%Y%m%d)"; add "$b"
            fi
            # 手動の試し焼きは sha だけ。追跡タグを動かすと試し焼きが利用者に配られる
          done

          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags" | tr ',' '\n'

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/php/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # 必要なら linux/arm64 を足す（build 時間は倍近くになる）
          platforms: linux/amd64
          build-args: |
            ECCUBE_VERSION=${{ matrix.target.eccube }}
            PHP_VERSION=${{ matrix.target.php }}
            PHPREDIS_VERSION=${{ matrix.target.phpredis }}
          tags: ${{ steps.tags.outputs.tags }}
          # 焼き直しのときは土台を引き直し、キャッシュを使わない。apt の layer が
          # 当たると Debian のパッチが入らず、焼き直した意味が無い
          pull: true
          no-cache: ${{ needs.setup.outputs.refresh == 'true' }}
          # 系列 × PHP ごとにキャッシュを分ける。共有すると 4.3 の layer を 4.4 が
          # 引き当てて、違う系列の vendor が混ざる。
          cache-from: type=gha,scope=${{ matrix.target.series }}-php${{ matrix.target.php }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.series }}-php${{ matrix.target.php }}
          # 来歴（どのコミットからどのワークフローが焼いたか）と SBOM をイメージに添付する。
          # `docker buildx imagetools inspect <ref> --format '{{ json .Provenance }}'` で読める
          provenance: mode=max
          sbom: true

      # 脆弱性スキャン。push したイメージを Trivy で見て、結果を Code scanning に載せる。
      # **落とさない**（exit-code 0）。落とすと、土台の Debian に未修正の CVE が 1 つあるだけで
      # 毎週の焼き直し（= PHP のパッチ配布）が止まる。修正済み（fixed）の CRITICAL / HIGH だけを
      # 数え、Security タブで追う。PR（push しない）では走らない。
      - name: Trivy で脆弱性スキャン
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target.series }}-php${{ matrix.target.php }}-${{ needs.setup.outputs.ref == github.sha && github.sha || needs.setup.outputs.ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: 結果を Code scanning へ
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.target.series }}-php${{ matrix.target.php }}

  # Dockerfile が変わっていないリリース: 追跡タグに -vX.Y.Z の名前を足すだけ。
  # 元は <系列>-php<版>（直近の焼き直し）。追跡タグ自体は動かさない（もっと新しいパッチが
  # 入った焼き直しを、リリース時点の古いビルドで上書きしないため）。
  retag:
    needs: setup
    if: needs.setup.outputs.mode == 'retag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 名前を足す
        run: |
          img="${REGISTRY}/${IMAGE_NAME}"
          series='${{ matrix.target.series }}'; php='${{ matrix.target.php }}'
          src="${img}:${series}-php${php}"
          tags=(-t "${img}:${series}-php${php}-${GITHUB_REF_NAME}")
          [ '${{ matrix.target.default }}' = 'true' ] && tags+=(-t "${img}:${series}-${GITHUB_REF_NAME}")
          echo "${src} → ${tags[*]}"
          docker buildx imagetools create "${tags[@]}" "$src"
