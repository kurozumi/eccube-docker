# 紹介ページ（site/）を GitHub Pages に配る。
#
# 動くのは **Release を出したとき**と手動実行だけ。紹介ページは最新リリースを指すもので、
# main への push で動かすと、まだ出していない版の番号がページに載る。
#
# site/ は .gitattributes で配布物（tag の tarball）から外してある。利用者に要らない。
#
# __TAG__ / __VER__ は配る直前に置き換える。JS で API を叩かせない（静的なまま）。
#   __TAG__ … v1.0.0
#   __VER__ … 1.0.0（tarball の展開先ディレクトリ名に使う）
# **github-pages 環境の deployment branch policy に `v*`（tag）が要る。** release で動く
# 実行の ref は `refs/tags/vX.Y.Z` で、環境の既定は `main` しか許さない。無いと
# 「Tag "v1.0.2" is not allowed to deploy to github-pages due to environment protection
# rules」でステップが 1 つも走らずに落ちる（v1.0.2 で実際に落ちた）。設定は
# Settings → Environments → github-pages → Deployment branches and tags、または
#   gh api -X POST repos/<owner>/<repo>/environments/github-pages/deployment-branch-policies -f name='v*' -f type=tag
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 版を埋める
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # release で起動したときはそのタグ。手動なら最新の Release を引く
          tag='${{ github.event.release.tag_name }}'
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          [ -n "$tag" ] || { echo "Release がありません。先に Release を出してください" >&2; exit 1; }
          ver="${tag#v}"
          sed -i "s/__TAG__/${tag}/g; s/__VER__/${ver}/g" site/index.html
          echo "tag=${tag} ver=${ver}"
          grep -c '__TAG__\|__VER__' site/index.html && { echo "置き換え漏れ" >&2; exit 1; } || true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
