# LB / リバースプロキシ背後で X-Forwarded-* を信頼する設定（本体は未配線のため補う）。
#
# なぜ必要か: HTTPS を LB で終端して app へは HTTP で来る構成だと、これを設定しないと
#   $request->isSecure() が false のままになり、
#     - セッション Cookie の secure / SameSite=None が付かない（決済リダイレクトで問題）
#     - 生成 URL やリダイレクトが http:// になる
#   といった不具合が起きる。
#
# 既定は空＝どのプロキシも信頼しない。**本番（compose.prod.yaml）と複数ホスト（compose.app.yaml）は
# REMOTE_ADDR**。nginx が X-Forwarded-For の右端（直前の公開層・LB が付けた値）を本当の IP として
# REMOTE_ADDR に入れ、PHP へ渡す X-Forwarded-For もその 1 つに置き換えるので（docker/nginx/default.conf）、
# LB のサブネットを書くとかえって HTTPS と判定されない。前提は「nginx に公開層・LB からしか届かない」こと。
#
# **X-Forwarded-Host / X-Forwarded-Port は信じない。** AWS ALB や Cloudflare LB はお客さんが送った
# X-Forwarded-Host をそのまま通すので、信じるとパスワード再設定のメールのリンクを別のドメインへ
# 向けられる。Host はどの LB もそのまま渡すので、要らない。
parameters:
    env(TRUSTED_PROXIES): ''

framework:
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers:
        - 'x-forwarded-for'
        - 'x-forwarded-proto'
