# セッションを Redis に載せる（プロファイル redis のときだけマージされる）。
#
# **セッションハンドラは framework.session.handler_id で決まる。** 本体の framework.yaml が
# `session.handler.native_file` を指しているので、サービスを定義するだけでは使われない。
# 以前はこのファイルが本体の SameSiteNoneCompatSessionHandler の内側だけを差し替えていたが、
# 4.4 ではそのクラスがどこからも参照されておらず（SameSite は cookie_samesite で本体が扱う）、
# **セッションはずっとファイル（var/sessions）に書かれていた**（#117 の検証で判明）。
# packages/ の yaml は全部読まれてマージされ、同じキーは後勝ちなので、ここで上書きする。
#
# **切り替えた瞬間、全員ログアウトになる。** ファイルに入っていたセッションは
# Redis へ移らない。カートも消える。本番で有効にするなら、そのつもりで時間を選ぶ。
# 戻すときも同じ。
framework:
  session:
    handler_id: Customize\Session\RawRedisSessionHandler

services:
  # セッション保存用 Redis 接続（キャッシュ用 redis とは別インスタンス＝noeviction）。
  # URL の :password@ は createConnection が解釈する（REDIS_PASSWORD）
  eccube.session.redis:
    class: Redis
    factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
    arguments:
      - '%env(SESSION_REDIS_URL)%'

  # 生の Redis セッションハンドラ。TTL は gc_maxlifetime 準拠。
  # Symfony の RedisSessionHandler ではなく自前なのは、strict インターフェースの二重ラップを避けるため
  Customize\Session\RawRedisSessionHandler:
    arguments:
      $redis: '@eccube.session.redis'
      $prefix: 'ecses:'
