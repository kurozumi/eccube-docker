name: eccube

# 全サービス共通のログ上限。無制限だと高トラフィックでディスクを食い潰し
# ホストごと停止するため必須（1 サービスあたり最大 10MB×5 世代）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# ec-cube と worker（メール consumer）で共有する環境変数。
# worker 側は SKIP フラグだけ上書きする（下記 worker サービス参照）。
x-eccube-environment: &eccube-environment
  # .env の値を EC-CUBE / エントリポイントへ明示的に渡す
  APP_ENV: ${APP_ENV:-prod}
  APP_DEBUG: ${APP_DEBUG:-0}
  # DATABASE_URL は DB_* から組み立てる（パスワードを二重に持たせない）。
  # environment は env_file より優先されるので、.env に古い DATABASE_URL が
  # 残っていてもこの derived 値が勝つ。
  DATABASE_URL: "mysql://${DB_USER:-eccube}:${DB_PASSWORD:-eccube_pass}@db:3306/${DB_NAME:-eccube_db}?serverVersion=${DATABASE_SERVER_VERSION:-mariadb-10.6.0}&charset=utf8mb4"
  DATABASE_SERVER_VERSION: ${DATABASE_SERVER_VERSION:-mariadb-10.6.0}
  # 本番は実メールサービスの DSN を .env で設定する。未設定なら送信は破棄（null）。
  # 開発は compose.override.yaml が Mailpit 宛てに上書きする。
  MAILER_DSN: ${MAILER_DSN:-null://null}
  ECCUBE_ADMIN_ROUTE: ${ECCUBE_ADMIN_ROUTE:-admin}
  ECCUBE_LOCALE: ${ECCUBE_LOCALE:-ja}
  # テーマ。**ここで渡すのは意図的。** 管理画面（オーナーズストア → テンプレート管理）
  # で選ぶと本体はコンテナ内の /var/www/html/.env に書くが、そこは eccube_app
  # ボリュームの中で、bin/upgrade.sh がボリュームを作り直すと消える（ファイルは
  # bind mount で残るのに**選択だけ default に戻る**）。環境変数で渡せば本体は
  # 「上書きされている」と表示して管理画面からの変更を拒否する。それが正しい。
  ECCUBE_TEMPLATE_CODE: ${ECCUBE_TEMPLATE_CODE:-default}
  # www-data の uid / gid をホストのユーザーに合わせる（Linux の本番で必須。
  # 未設定なら 33 のまま。macOS の Docker Desktop は透過なので不要）。
  # 揃えないと、管理画面が書いたファイルを git pull が上書きできず、ホストが
  # 置いたファイルを管理画面が書けない。docker/php/docker-entrypoint.sh 参照。
  PUID: ${PUID:-}
  PGID: ${PGID:-}
  # LB/プロキシ背後で X-Forwarded-* を信頼する範囲（既定は空＝信頼しない）。
  # HTTPS 終端 LB を使う複数ホスト構成では LB の IP/サブネットを設定する。
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  # DB スキーマ操作の可否。単一ホストは 0（実行）。複数ホストで「app ロール」の
  # ホストは 1 にしてスキーマに触らせない（init ロール 1 台だけ 0 にする）。
  ECCUBE_SKIP_DB_INIT: ${ECCUBE_SKIP_DB_INIT:-0}
  # --scale の追加レプリカ用: cache:clear もスキップ（共有 var/cache を触らない）。
  # 使い方は README「水平スケール」参照。
  ECCUBE_SKIP_CACHE_CLEAR: ${ECCUBE_SKIP_CACHE_CLEAR:-0}
  # 任意機能のスイッチ。**COMPOSE_PROFILES をそのまま渡す。** entrypoint はここから
  # redis / messenger を読み、対応する設定を app/config/eccube/packages へ入れる。
  # サービスの起動（profiles）と設定の投入が同じ値で決まるので、片方だけ有効という
  # 事故が起きない。`docker compose --profile redis up` の CLI 指定はここへ届かないので、
  # **.env の COMPOSE_PROFILES に書くこと。**
  ECCUBE_PROFILES: ${COMPOSE_PROFILES:-}
  # ECCUBE_AUTH_MAGIC はここ（environment）では渡さない。空文字を注入すると
  # Symfony Dotenv が「設定済み」とみなし、secret が空で bin/console が落ちるため。
  # 値は .env（env_file）で渡す。bin/init.sh が未設定なら自動生成する。
  DB_HOST: db
  DB_USER: ${DB_USER:-eccube}
  DB_PASSWORD: ${DB_PASSWORD:-eccube_pass}
  DB_NAME: ${DB_NAME:-eccube_db}
  # Symfony アプリキャッシュの Redis 共有（optional/redis/redis_cache.yaml が参照。redis プロファイルのときだけ）
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  # セッション保存用 Redis（Tier 2）。app/Customize/Resource/config/services.yaml が参照。
  # キャッシュ用 redis とは別インスタンス（永続化・noeviction）を既定にする。
  SESSION_REDIS_URL: ${SESSION_REDIS_URL:-redis://redis-session:6379}
  # php-fpm プールのチューニング（entrypoint が生成）。サーバー規模に合わせて調整。
  PHP_FPM_PM: ${PHP_FPM_PM:-dynamic}
  PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-20}
  PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-4}
  PHP_FPM_MIN_SPARE: ${PHP_FPM_MIN_SPARE:-2}
  PHP_FPM_MAX_SPARE: ${PHP_FPM_MAX_SPARE:-6}
  PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}

# ec-cube と worker で共有するボリューム構成
x-eccube-volumes: &eccube-volumes
  # EC-CUBE 本体（イメージ内容）は名前付きボリュームに展開される
  - eccube_app:/var/www/html
  # ── 本体を汚さず、Git 管理する「自分のコード」だけを重ねる ──
  - ./app/Customize:/var/www/html/app/Customize:ro
  # **app/template は本番でも rw。** 管理画面（ページ管理・ブロック管理・メール設定の
  # 本文）がここに書く。ro だとブロックと新規ページの保存が 500、メール本文は保存エラー
  # （本体は dumpFile を捕まえていない）。コードの側（Customize / DoctrineMigrations /
  # Plugin）は ro のまま。所有者の食い違いは PUID で揃える。
  - ./app/template:/var/www/html/app/template
  # 独自 migration は app/CustomizeMigrations へ載せる。app/DoctrineMigrations に直接
  # 被せると、そこに入っている本体の migration（18 件・データ移行）を覆い隠してしまう。
  # 両方を doctrine に登録するのが app/config/eccube/packages/doctrine_migrations.yaml。
  - ./app/DoctrineMigrations:/var/www/html/app/CustomizeMigrations:ro
  # プラグイン（開発・導入したものを Git 管理）。dev は override が rw で上書き
  - ./app/Plugin:/var/www/html/app/Plugin:ro
  # 独自の CSS/JS。本体が default_frame.twig で customize.css / customize.js を
  # 自動読込する公式フック。asset(...,'user_data') → /html/user_data で配信
  - ./html/user_data:/var/www/html/html/user_data:ro
  # 管理画面（コンテンツ管理 → CSS 管理 / JS 管理）は、この 2 つのディレクトリの
  # customize.css / customize.js を**直接書き換える**（本体の CssController /
  # JsController が dumpFile する）。親は ro のまま、ここだけ rw で入れ子にする。
  #
  # **ro のままだと「保存できない」ではなく「画面が空に見える」。** 本体は
  # `file_exists && is_writable` が真のときしかテキストエリアに中身を入れないので、
  # ファイルには CSS が入っているのに、管理画面では空欄が表示される。
  #
  # scss のビルド先は customize-theme.css で、こちらとは別（frontend/scss/）。
  # 同じ場所へビルドすると、店が画面から入れた CSS をビルドのたびに黙って消す。
  - ./html/user_data/assets/css:/var/www/html/html/user_data/assets/css
  - ./html/user_data/assets/js:/var/www/html/html/user_data/assets/js
  # オリジナルテーマの静的物。asset() の base_path は /html/template/<テーマコード>
  # の 1 本だけでフォールバックが無いので、テーマを変えるなら丸ごと要る
  # （bin/theme.sh init が本体から写す）。**テーマコードは original 固定。**
  # `${ECCUBE_TEMPLATE_CODE}` で可変にすると、default のとき本体のテーマを
  # 空のディレクトリで覆い隠してサイトの CSS が丸ごと消える。
  - ./html/template/original:/var/www/html/html/template/original:ro
  # アップロード画像（商品画像等）は専用ボリュームに分離する。理由:
  #   1) 本体イメージ再ビルド・コンテナ再作成でも消えない（app と分離）
  #   2) このボリュームを NFS/EFS ドライバに差し替えれば複数ホストで共有でき、
  #      その場合データは外部サーバー側なので down -v でも失われない
  #   ※ ローカルボリュームのままだと down -v（reset/switch-version が使う）で消える。
  #     事前バックアップ方法は README「アップロード画像の共有ストレージ」を参照。
  - eccube_upload:/var/www/html/html/upload
  # framework 級設定（monolog 等）はステージングへ置き、entrypoint が本体へマージ
  - ./app/config/eccube/packages:/opt/eccube-config/packages:ro
  # 任意機能（redis / messenger）の設定。COMPOSE_PROFILES に応じて entrypoint が選ぶ
  - ./app/config/eccube/optional:/opt/eccube-config/optional:ro
  # ユニットテスト設定（app/Customize/Tests を対象。本体の phpunit.xml.dist は残す）。
  # PHPUnit 9 系（4.2/4.3）と 10 以降（4.4〜）で書式が非互換なので両方置き、
  # bin/test.sh がコンテナの PHPUnit のバージョンを見て使う方を選ぶ。
  - ./phpunit.xml:/var/www/html/phpunit.xml:ro
  - ./phpunit.11.xml:/var/www/html/phpunit.11.xml:ro

services:
  ec-cube:
    logging: *default-logging
    # 配布イメージを使うなら .env に ECCUBE_IMAGE を書く（例:
    # ghcr.io/<owner>/<repo>/ec-cube:4.3-v1.0.0）。未設定ならローカル build。
    # **既定名を変えないこと。** 一度 `eccube-ec-cube:local` に変えたところ、
    # 既存の環境では稼働中のイメージ（eccube-ec-cube）と名前が食い違い、
    # `docker compose run`（backup.sh / restore.sh / upgrade.sh の事前確認）の
    # たびに**フルビルドが走った**。バックアップが数分止まって見える。
    # **切替はスクリプト側の bin/lib/image.sh が見ている。** 起動系のスクリプトで
    # `up -d --build` を直接書くと、pull した配布イメージを build で潰す。
    image: ${ECCUBE_IMAGE:-eccube-ec-cube}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        ECCUBE_VERSION: ${ECCUBE_VERSION:-~4.3.0}
        PHP_VERSION: ${PHP_VERSION:-8.2}
        PHPREDIS_VERSION: ${PHPREDIS_VERSION:-6.0.2}
    env_file: .env
    environment: *eccube-environment
    volumes: *eccube-volumes
    depends_on:
      db:
        condition: service_healthy
      # redis はプロファイルで起動する任意サービス。required: false で、
      # 起動していなければ待たずに進む（compose v2.20+）。
      redis:
        condition: service_healthy
        required: false
      redis-session:
        condition: service_healthy
        required: false
    # php-fpm の死活を FastCGI ping で確認（libfcgi-bin の cgi-fcgi）。
    # start_period は entrypoint（migrate + cache:clear）の所要時間を見込む。
    healthcheck:
      test: ["CMD", "sh", "-c", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  # メール送信の consumer（Symfony Messenger）。messenger.yaml が SendEmailMessage を
  # async（Doctrine transport）へルーティングし、この worker が消化して SMTP へ送る。
  # SMTP 停止中もメッセージは DB に残り、復旧後に送信される。
  # --time-limit で定期的に終了し restart で再起動（コードやキャッシュの鮮度維持）。
  worker:
    logging: *default-logging
    # プロファイル messenger のときだけ起動（.env の COMPOSE_PROFILES）。
    # 設定側（optional/messenger）も同じスイッチで入る。
    profiles: ["messenger"]
    # ec-cube と同一イメージ（同じ本体コードで consume させる）
    image: ${ECCUBE_IMAGE:-eccube-ec-cube}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        ECCUBE_VERSION: ${ECCUBE_VERSION:-~4.3.0}
        PHP_VERSION: ${PHP_VERSION:-8.2}
        PHPREDIS_VERSION: ${PHPREDIS_VERSION:-6.0.2}
    env_file: .env
    environment:
      <<: *eccube-environment
      # 共有 var/cache と DB スキーマには触らない（ec-cube が起動時に整えている）
      ECCUBE_SKIP_DB_INIT: "1"
      ECCUBE_SKIP_CACHE_CLEAR: "1"
    volumes: *eccube-volumes
    command: ["runuser", "-u", "www-data", "--", "php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=192M", "--quiet"]
    depends_on:
      ec-cube:
        condition: service_healthy
    # consume は PID 1 なので死ねばコンテナごと再起動される（restart）。
    # healthcheck は「起動したが consume でない状態」の可視化用（pgrep は無いので /proc）。
    healthcheck:
      test: ["CMD", "sh", "-c", "tr '\\0' ' ' < /proc/1/cmdline | grep -q messenger:consume"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - eccube_app:/var/www/html:ro
      # 独自 CSS/JS はホスト側 bind を直接配信（named volume には無いため）
      - ./html/user_data:/var/www/html/html/user_data:ro
      # アップロード画像を配信（ec-cube と同じ専用ボリュームを読み取り専用で）
      - eccube_upload:/var/www/html/html/upload:ro
      # オリジナルテーマの静的物（ec-cube 側と同じ。配信するのは nginx なので要る）
      - ./html/template/original:/var/www/html/html/template/original:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ec-cube:
        condition: service_healthy
    restart: unless-stopped

  db:
    logging: *default-logging
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${DB_NAME:-eccube_db}
      MYSQL_USER: ${DB_USER:-eccube}
      MYSQL_PASSWORD: ${DB_PASSWORD:-eccube_pass}
      TZ: Asia/Tokyo
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
    volumes:
      - db_data:/var/lib/mysql
      # チューニング（innodb_buffer_pool_size 等）。サーバー RAM に合わせて調整する。
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      # 認証まで確かめる。mysqladmin ping はサーバープロセスが生きてさえいれば
      # 認証に失敗しても成功を返すため、DB ボリュームに焼かれたパスワードと .env が
      # 食い違っていても healthy になり、アプリだけが接続できない状態を見逃す
      # （down -v せずに .env の DB_PASSWORD を変えると起こる）。
      # アプリと同じ経路（TCP + DB_USER + DB_NAME）で 1 クエリ流して判定する。
      # パスワードは MYSQL_PWD 環境変数で渡す（-p<pass> だとプロセスリストに露出する）。
      # $$ は compose のエスケープで、コンテナ内の環境変数として実行時に展開される。
      test: ["CMD", "sh", "-c", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" exec mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      # 初回はデータディレクトリ作成とユーザー作成が終わるまで TCP で入れない。
      # その間の失敗を retries に数えないための猶予（成功した時点で即抜ける）。
      # 起動待ちは start_period に任せ、retries は定常運転時の一時的な失敗に備える分だけ。
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # 共有キャッシュ（Symfony アプリキャッシュ）。将来のセッション共有・複数ホスト化の土台。
  # cache 用途なので永続化は無効（--save "" / appendonly no）。maxmemory 到達時は LRU で破棄。
  redis:
    logging: *default-logging
    # プロファイル redis のときだけ起動（.env の COMPOSE_PROFILES）。初回は無効。
    profiles: ["redis"]
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # セッション保存用 Redis（Tier 2: 複数ホストでセッション共有）。キャッシュ用とは分離。
  # セッションは失うとログアウトされるため、永続化（appendonly）＋noeviction（LRU で
  # 勝手に消さない）にする。maxmemory は必須: 無制限だとボットのセッション大量生成で
  # ホストの RAM を圧迫し OOM killer が他コンテナを道連れにする。上限到達時は
  # 「新規セッションの書込エラー」で済み、既存ユーザーのカート/ログインは守られる。
  redis-session:
    logging: *default-logging
    # redis と同じプロファイルで起動する（セッション共有はキャッシュ共有とセット）
    profiles: ["redis"]
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--maxmemory"
      - "${SESSION_REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
    volumes:
      - redis_session_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Mailpit は開発専用（送信メールの確認用）。dev だけで起動するため
  # compose.override.yaml に定義している。本番では使わない。

volumes:
  eccube_app:
  db_data:
  redis_session_data:
  # アップロード画像。複数ホストで共有するときは NFS/EFS ドライバに差し替える。
  # 例（NFS）:
  #   eccube_upload:
  #     driver: local
  #     driver_opts:
  #       type: nfs
  #       o: "addr=10.0.0.10,rw,nfsvers=4"
  #       device: ":/export/eccube/upload"
  eccube_upload:
